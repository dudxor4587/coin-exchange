apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection
  namespace: coin-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projection
  template:
    metadata:
      labels:
        app: projection
    spec:
      containers:
        - name: projection
          image: coin-exchange/projection:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            # trading과 같은 trading_db를 공유(projection이 Order/Trade 기록)
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://trading-db:3306/trading_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: projection
  namespace: coin-exchange
spec:
  selector:
    app: projection
  ports:
    - port: 8085
      targetPort: 8085
