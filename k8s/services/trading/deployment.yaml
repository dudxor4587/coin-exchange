apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading
  namespace: coin-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading
  template:
    metadata:
      labels:
        app: trading
    spec:
      containers:
        - name: trading
          image: coin-exchange/trading:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            # 무상태 — DB 없음 (주문 projection·coin 시드는 projection 서비스가 맡음)
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SERVICES_FUNDS_BASE_URL
              value: "http://funds:8083"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # liveness = 앱 살아있나(재시작 판단, 의존성 무관). readiness = 트래픽 받을 준비(redis·kafka 반영).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trading
  namespace: coin-exchange
spec:
  selector:
    app: trading
  ports:
    - port: 8084
      targetPort: 8084
