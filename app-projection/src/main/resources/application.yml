spring:
  application:
    name: projection-service
  profiles:
    active: test
  datasource:
    url: jdbc:mysql://coin-exchange-trading-db:3306/trading_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  rabbitmq:
    host: coin-exchange-rabbitmq
    port: 5672
    username: guest
    password: guest
    # 알림 발행 시 trace 컨텍스트를 메시지 헤더로 전파 → notification이 이어받음
    template:
      observation-enabled: true
  kafka:
    bootstrap-servers: coin-exchange-kafka:9092
    consumer:
      group-id: order-projection
      # 크래시 후 재시작 시 커밋한 offset부터 재개 → 유실 없이 이어서 projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # DB 반영을 마친 뒤 offset 커밋 → at-least-once (유실 방지)
      ack-mode: manual
      # Kafka 레코드 헤더의 trace 컨텍스트를 이어받아 소비 스팬을 연결
      observation-enabled: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: projection-service
