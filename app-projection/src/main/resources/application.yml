spring:
  application:
    name: projection-service
  profiles:
    active: test
  datasource:
    url: jdbc:mysql://coin-exchange-trading-db:3306/trading_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  rabbitmq:
    host: coin-exchange-rabbitmq
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: coin-exchange-kafka:9092
    consumer:
      group-id: order-projection
      # 크래시 후 재시작 시 커밋한 offset부터 재개 → 유실 없이 이어서 projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # DB 반영을 마친 뒤 offset 커밋 → at-least-once (유실 방지)
      ack-mode: manual

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: projection-service
