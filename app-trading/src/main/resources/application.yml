spring:
  application:
    name: trading-service
  profiles:
    active: test
  datasource:
    url: jdbc:mysql://coin-exchange-trading-db:3306/trading_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  data:
    redis:
      host: coin-exchange-redis
      port: 6379
  kafka:
    # 프로듀서가 Kafka 레코드 헤더로 trace 컨텍스트를 실어 보냄 → projection이 이어받음
    template:
      observation-enabled: true
    bootstrap-servers: coin-exchange-kafka:9092
    producer:
      # durable 로그: 모든 복제본에 저장 확인 후 ack (단일 브로커라 실질 acks=1)
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0   # 로컬 관찰용 — 모든 요청 트레이싱
  metrics:
    tags:
      application: trading-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        trade_latency_seconds: true
        order.flow.segment: true

resilience4j:
  circuitbreaker:
    instances:
      funds:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50           # 최근 호출의 50%가 실패하면 open
        slow-call-duration-threshold: 2s     # 2초 넘는 호출은 느린 호출로 간주
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s     # open 후 10초 뒤 half-open으로 시험
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException  # funds 4xx(업무 오류)는 회로에 카운트 안 함

jwt:
  secret: dev-secret-change-me-this-must-be-long-enough-for-hs256-algorithm
  expiration: 3600000

matching:
  engine: redis

services:
  funds:
    base-url: http://coin-exchange-funds:8083
